# FICTIONAL EXAMPLE. This profile describes an invented person. It contains no real
# personal data. It shows the shape of a health profile and is used to test the schema.
#
# Schema: knowledge/schema/profile.schema.json
# Guide:  docs/science/health-profile.md
# Flag IDs and recent-event expiry periods come from knowledge/gates/gates.yaml.
#
# A real profile lives only on the user's machine. It is never committed, uploaded or sent.

schema_version: 1
updated_on: 2026-09-27

body:
