supplements:
  - name: Creatine monohydrate powder
    nutrient: creatine
    amount: {min: 3, max: 5, unit: g}
    frequency: daily
  - name: Vitamin D3 capsule
    nutrient: vitamin D
    amount: {min: 1000, max: 1000, unit: IU}
    frequency: daily
  - name: Pre-workout drink, caffeine not listed on label
    nutrient: caffeine
    amount: {min: 90, max: 390, unit: mg}
    frequency: training_days

life_stage:
