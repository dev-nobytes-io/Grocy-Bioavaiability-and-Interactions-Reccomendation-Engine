training:
  types: [resistance, endurance]
  sessions_per_week: 5
  experience_years: 4
  current_phase: hypertrophy_block
  upcoming_sessions:
    - date: 2026-09-28
      time: "07:00"
      type: resistance
      intensity: hard
    - date: 2026-09-29
      type: endurance
      intensity: easy
  current_injuries:
    - description: Mild left shoulder niggle, avoiding overhead pressing
      since: 2026-09-10

diet:
