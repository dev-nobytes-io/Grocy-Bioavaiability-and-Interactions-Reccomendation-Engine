  restrictions:
    - reason: ethical
      foods: [gelatin]
  dislikes: [mushrooms]
  meal_times:
    - name: breakfast
      time: "06:30"
    - name: lunch
      time: "12:30"
    - name: dinner
      time: "19:00"

