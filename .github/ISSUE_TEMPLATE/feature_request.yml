name: Feature or design proposal
description: Suggest a feature, design change or documentation improvement.
title: "[Proposal] "
labels: ["proposal"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't someone do today, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: checkboxes
    id: purpose
    attributes:
      label: Intended purpose
      options:
        - label: This fits the intended purpose in SAFETY.md. It does not diagnose, treat or interpret test results.
          required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
